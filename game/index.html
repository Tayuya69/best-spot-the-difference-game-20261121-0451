<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Harbor — Find 10 Differences</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <h1>MIDNIGHT HARBOR</h1>
    <p class="tag">Find 10 differences — two pictures, one night, ten tiny lies</p>
  </div>
  <div class="round-label"><span id="roundName">Round 1 · Lantern Pier</span></div>
</header>

<section id="hud">
  <div class="hud-box"><span class="hud-k">FOUND</span><span class="hud-v" id="foundCount">0 / 10</span></div>
  <div class="hud-box"><span class="hud-k">TIME</span><span class="hud-v" id="timeLeft">3:00</span></div>
  <div class="hud-box"><span class="hud-k">SCORE</span><span class="hud-v" id="score">0</span></div>
  <div class="hud-box"><span class="hud-k">STREAK</span><span class="hud-v" id="streak">×0</span></div>
  <div class="hud-box"><span class="hud-k">ROUND</span><span class="hud-v" id="roundNum">1 / 5</span></div>
  <button id="hintBtn" type="button">HINT · <span id="hintsLeft">3</span> left (−50)</button>
  <button id="muteBtn" type="button">SOUND ON</button>
</section>

<main id="boards">
  <figure class="panel">
    <figcaption>PICTURE A</figcaption>
    <svg id="svgL" viewBox="0 0 640 420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Picture A"></svg>
  </figure>
  <figure class="panel">
    <figcaption>PICTURE B</figcaption>
    <svg id="svgR" viewBox="0 0 640 420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Picture B"></svg>
  </figure>
</main>

<section id="progress">
  <div id="diffDots"></div>
  <p id="tip">Click a difference on either picture. A right click rings it green on both sides. A wrong click costs 5 seconds.</p>
</section>

<div id="overlay" class="hidden">
  <div id="overlayCard"></div>
</div>

<script src="scenes.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
<script src="main.js"></script>
</body>
</html>
